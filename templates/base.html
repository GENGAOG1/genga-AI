<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GENGA AI{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="topbar"><a href="/">GENGA AI</a><nav>
{% if session.get('user_id') %}<a href="/chat/">Chat</a><a href="/auth/logout">Abmelden</a>
{% else %}<a href="/auth/login">Anmelden</a><a href="/auth/register">Registrieren</a>{% endif %}
</nav></header>
{% with messages = get_flashed_messages() %}{% if messages %}<div class="flash">{% for m in messages %}<p>{{ m }}</p>{% endfor %}</div>{% endif %}{% endwith %}
<main>{% block content %}{% endblock %}</main>
<script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body></html>
